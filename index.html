<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VisaMotion">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f6ea">
<title>VisaMotion — Visa File Box</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --lime:#bfe86a; --lime-d:#9ed23f; --lime-deep:#7cb32a;
    --blue:#6aa84f; --blue-d:#5a9440; --purple:#8bbf4a; --purple-d:#7cb32a;
    --teal:#a7d94d; --pink:#ef8a6a; --green:#7cb32a;
    --ink:#20301a; --ink2:#5c6b4f; --ink3:#94a184;
    --glass:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.80);
    --stroke:rgba(255,255,255,.9); --line:rgba(120,150,90,.16);
    --shadow:0 24px 50px -22px rgba(90,130,60,.35), 0 6px 16px -8px rgba(90,130,60,.18);
    --shadow-sm:0 14px 30px -16px rgba(90,130,60,.32), 0 3px 10px -6px rgba(90,130,60,.16);
    --shadow-lg:0 36px 70px -30px rgba(70,110,40,.4), 0 10px 24px -12px rgba(90,130,60,.2);
    --r:26px; --r-sm:18px;
    --bg-grad: linear-gradient(180deg,#f3f6ea 0%,#eef3e3 100%);
  }
  html[data-theme="dark"]{
    --ink:#eef4e6; --ink2:#aeb9a2; --ink3:#7f8a72;
    --glass:rgba(28,36,24,.66); --glass-b:rgba(30,38,26,.82);
    --stroke:rgba(255,255,255,.10); --line:rgba(255,255,255,.10);
    --shadow:0 24px 50px -22px rgba(0,0,0,.6), 0 6px 16px -8px rgba(0,0,0,.4);
    --shadow-sm:0 14px 30px -16px rgba(0,0,0,.55), 0 3px 10px -6px rgba(0,0,0,.35);
    --shadow-lg:0 36px 70px -30px rgba(0,0,0,.65), 0 10px 24px -12px rgba(0,0,0,.4);
    --bg-grad: linear-gradient(180deg,#10150c 0%,#0c1008 100%);
  }
  html[data-theme="dark"] .aurora i:nth-child(1){background:radial-gradient(circle,#2a3a1e,transparent 65%)}
  html[data-theme="dark"] .aurora i:nth-child(2){background:radial-gradient(circle,#26331c,transparent 65%)}
  html[data-theme="dark"] .aurora i:nth-child(3){background:radial-gradient(circle,#1f2c16,transparent 65%)}
  html[data-theme="dark"] .tab.on{background:#e9f1dc;color:#1d1d1f}
  html[data-theme="dark"] .tabbar{background:rgba(24,32,20,.9)}
  html[data-theme="dark"] .roundbtn.accent{color:#1b2410}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  html,body{height:100%; margin:0; overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Noto Sans Bengali",Tahoma,sans-serif;
    color:var(--ink); background:var(--bg-grad); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  /* animated gradient backdrop (green/lime) */
  .aurora{position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(60px); opacity:.9}
  .aurora i{position:absolute; border-radius:50%; display:block; mix-blend-mode:multiply}
  .aurora i:nth-child(1){width:46vmax;height:46vmax;left:-6vmax;top:-8vmax;background:radial-gradient(circle,#d9ecac,transparent 65%);animation:float1 22s ease-in-out infinite}
  .aurora i:nth-child(2){width:40vmax;height:40vmax;right:-8vmax;top:6vmax;background:radial-gradient(circle,#e7f2c2,transparent 65%);animation:float2 26s ease-in-out infinite}
  .aurora i:nth-child(3){width:42vmax;height:42vmax;left:8vmax;bottom:-10vmax;background:radial-gradient(circle,#c9e693,transparent 65%);animation:float3 30s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.12)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-7vmax,7vmax) scale(.95)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-5vmax) scale(1.1)}}
  /* phone frame */
  #phone{
    position:relative; width:393px; height:852px; max-height:100vh;
    background:var(--bg-grad); overflow:hidden;
    display:flex; flex-direction:column;
    border-radius:0; z-index:1;
  }
  @media (min-width:430px) and (min-height:880px){
    #phone{border-radius:54px; height:852px; width:393px; box-shadow:var(--shadow-lg), 0 0 0 11px #0c0f17, 0 0 0 13px #2a2f3d}
  }
  @media (max-width:429px), (max-height:879px){
    #phone{width:100vw; height:100dvh; border-radius:0}
  }
  #screens{position:relative; flex:1 1 auto; overflow:hidden}
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden;
  }
  .screen.active{display:flex; animation:slideIn .34s cubic-bezier(.22,.9,.3,1)}
  @keyframes slideIn{from{opacity:0; transform:translateX(16px)}to{opacity:1; transform:translateX(0)}}
  .scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:0 20px calc(96px + env(safe-area-inset-bottom,0px)); scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  .h1{font-size:32px; font-weight:800; letter-spacing:-.6px; line-height:1.08; margin:0}
  .sub{color:var(--ink2); font-size:14.5px; margin:6px 0 0}
  .sect{display:flex; align-items:flex-end; justify-content:space-between; margin:24px 0 12px}
  .sect h2{font-size:20px; font-weight:800; margin:0; letter-spacing:-.3px}
  .sect .link{color:var(--blue); font-weight:700; font-size:14px; display:flex; gap:5px; align-items:center}

  .glass{background:var(--glass); border:1px solid var(--stroke); box-shadow:var(--shadow); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); border-radius:var(--r)}
  .row{display:flex; gap:14px}
  .grow{flex:1}
  .tap{cursor:pointer; transition:transform .12s ease, box-shadow .2s}
  .tap:active{transform:scale(.97)}

  /* big gradient cards (Home) */
  .bcard{flex:1; border-radius:28px; padding:18px; color:#fff; position:relative; overflow:hidden; min-height:212px; display:flex; flex-direction:column}
  .bcard .ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;font-size:24px; backdrop-filter:blur(6px)}
  .bcard .dots{position:absolute;top:18px;right:16px;font-size:18px;opacity:.85}
  .bcard h3{font-size:23px;font-weight:800;margin:16px 0 12px;letter-spacing:-.4px}
  .barwrap{height:6px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
  .barwrap i{display:block;height:100%;background:#ffd23f;border-radius:99px}
  .bmeta{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;opacity:.95;font-weight:600}
  .bbtn{margin-top:auto;align-self:flex-start;background:#fff;color:var(--blue-d);border:none;font-weight:800;font-size:15px;padding:10px 16px;border-radius:14px;display:flex;gap:8px;align-items:center}
  .bcard.card-blue{background:linear-gradient(150deg,#aedb5b,#7cb32a)}
  .bcard.card-purple{background:linear-gradient(150deg,#cdea8e,#8fd14a)}
  .fast{position:absolute;right:16px;bottom:16px;font-size:16px;opacity:.9;letter-spacing:-2px}

  /* category grid */
  .cat{background:var(--glass-b);border:1px solid var(--stroke);border-radius:22px;padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;position:relative;backdrop-filter:blur(18px)}
  .cat .chev{position:absolute;top:14px;right:14px;color:var(--ink3);font-size:16px}
  .cat .fico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
  .cat h4{margin:2px 0 0;font-size:16px;font-weight:800}
  .cat p{margin:0;color:var(--ink2);font-size:13px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* tab bar — floating pill, dark active pill */
  .tabbar{
    position:absolute;left:16px;right:16px;bottom:16px;height:64px;z-index:55;
    background:rgba(255,255,255,.86);border:1px solid var(--stroke);border-radius:99px;
    box-shadow:0 20px 40px -18px rgba(90,130,60,.42); backdrop-filter:blur(28px) saturate(180%);
    display:flex; align-items:center; justify-content:space-around; padding:0 6px;
  }
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:700;flex:1;height:50px;cursor:pointer;position:relative;border-radius:99px;transition:background .2s,color .2s}
  .tab i{font-size:20px}
  .tab.on{background:#1d1d1f;color:#fff;flex:0 0 auto;width:64px;gap:3px}
  .tab.on i{font-size:19px}
  .tab span{display:block}
  .fab{
    width:62px;height:62px;border-radius:50%;margin-top:-30px;flex:0 0 62px;
    background:linear-gradient(150deg,#d3f07f,#a7d94d);color:#20301a;display:flex;align-items:center;justify-content:center;
    font-size:26px; box-shadow:0 16px 30px -10px rgba(140,190,70,.75), inset 0 1px 0 rgba(255,255,255,.6); cursor:pointer;
  }
  .fab i{animation:sparkle 2.6s ease-in-out infinite}
  @keyframes sparkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(8deg)}}

  /* ===== Home (green design) ===== */
  .homebar{display:flex;align-items:center;gap:10px;padding-top:8px}
  .hellopill{display:flex;align-items:center;gap:9px;background:var(--glass-b);border:1px solid var(--stroke);border-radius:99px;padding:6px 14px 6px 6px;box-shadow:var(--shadow-sm);min-width:0}
  .hellopill img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto}
  .hellopill small{display:block;font-size:10.5px;color:var(--ink2);line-height:1.1}
  .hellopill b{display:block;font-size:14px;font-weight:800;line-height:1.15}
  .hellopill i{font-size:12px;color:var(--ink3);margin-left:2px}
  .roundbtn{width:44px;height:44px;border-radius:50%;background:var(--glass-b);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow-sm);flex:0 0 auto;color:var(--ink)}
  .roundbtn.accent{background:linear-gradient(150deg,#d9f08a,#b6e455);color:#20301a;border-color:transparent}
  .roundbtn.accent i{animation:sparkle 2.6s ease-in-out infinite}
  .bigtitle{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.06;margin:0;color:var(--ink)}
  .chipline{display:flex;gap:9px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chipline::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:var(--glass-b);border:1px solid var(--stroke);border-radius:99px;padding:11px 18px;font-weight:700;font-size:14px;box-shadow:var(--shadow-sm);white-space:nowrap;color:var(--ink)}
  .chip.round{width:44px;height:44px;padding:0;justify-content:center;border-radius:50%;font-size:17px}
  .procard{margin-top:18px;background:linear-gradient(135deg,#cdea8e,#aedb5b);border-radius:24px;padding:16px;position:relative;box-shadow:0 18px 34px -20px rgba(120,170,50,.7)}
  .procard .proic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:20px;color:#3f5a1a}
  .procard .protxt{margin:9px 0 12px}
  .procard .protxt b{font-size:16.5px;font-weight:800;display:block;color:#26361a}
  .procard .protxt p{margin:2px 0 0;font-size:12.5px;color:#3f5a1a;line-height:1.4;max-width:92%}
  .probtn{width:100%;border:none;background:#fff;color:#26361a;font-weight:800;font-size:14.5px;padding:12px;border-radius:16px;box-shadow:0 6px 14px -8px rgba(60,90,30,.5)}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px}
  .quicksq{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--glass-b);border:1px solid var(--stroke);border-radius:22px;padding:14px 8px;box-shadow:var(--shadow-sm);text-align:center}
  .quicksq .qsic{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#3f5a1a}
  .quicksq span{font-size:12px;font-weight:700;color:var(--ink);line-height:1.2}
  .sect .link{color:var(--lime-deep)}

  /* ===== Chat head + orb ===== */
  .chathead{display:flex;align-items:center;gap:10px;padding:8px 20px 6px}
  .chathead .back{width:42px;height:42px;border-radius:50%;background:var(--glass-b);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow-sm);flex:0 0 auto}
  .titlepill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--glass-b);border:1px solid var(--stroke);border-radius:99px;padding:11px 16px;font-weight:800;font-size:15px;box-shadow:var(--shadow-sm)}
  .orobody{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 30px 40px}
  .orb{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(191,232,106,.45),rgba(191,232,106,.05) 62%,transparent 72%);
    animation:orbPulse 3.4s ease-in-out infinite;position:relative}
  .orb::before{content:"";position:absolute;inset:14px;border-radius:50%;
    background:conic-gradient(from 0deg,#d9f08a,#bfe86a,#8fd14a,#d9f08a);filter:blur(2px);opacity:.9;animation:orbSpin 8s linear infinite}
  .orbcore{position:relative;z-index:2;width:92px;height:92px;border-radius:50%;background:linear-gradient(150deg,#e6f7b8,#b6e455);
    display:flex;align-items:center;justify-content:center;font-size:38px;color:#26361a;box-shadow:inset 0 3px 12px rgba(255,255,255,.8), 0 10px 26px -10px rgba(120,170,50,.7)}
  @keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes orbSpin{to{transform:rotate(360deg)}}
  .orbh{font-size:30px;font-weight:800;letter-spacing:-.7px;text-align:center;line-height:1.15;color:var(--ink);margin:0}
  .chat-hidden{display:none}

  /* top nav */
  .navbar{display:flex;align-items:center;gap:12px;padding:2px 20px 12px}
  .navbar .back{width:38px;height:38px;border-radius:50%;background:var(--glass-b);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow-sm);cursor:pointer}
  .navbar h1{font-size:19px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
  .avatar{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:var(--shadow-sm);object-fit:cover}

  /* list rows */
  .lrow{display:flex;align-items:center;gap:14px;background:var(--glass-b);border:1px solid var(--stroke);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow-sm);margin-bottom:11px;cursor:pointer;backdrop-filter:blur(16px)}
  .lrow .fic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:0 0 auto}
  .lrow .txt{flex:1;min-width:0}
  .lrow .txt h4{margin:0 0 2px;font-size:16px;font-weight:800}
  .lrow .txt p{margin:0;font-size:12.5px;color:var(--ink2)}
  .lrow .chev{color:var(--ink3);font-size:15px}

  .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(124,179,42,.14);color:var(--lime-deep);font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px}
  .dot-on{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
  .livetag{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(34,197,94,.16);color:#1f9a60;margin-left:6px;letter-spacing:.3px;text-transform:uppercase}
  .offtag{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(246,184,57,.2);color:#9a6f00;margin-left:6px;letter-spacing:.3px;text-transform:uppercase}
  .statusrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--glass-b);border:1px solid var(--stroke);box-shadow:var(--shadow-sm);margin-bottom:9px}
  .statusrow .sdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .statusrow .sdot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
  .statusrow .sdot.off{background:#c9a227;box-shadow:0 0 0 4px rgba(201,162,39,.16)}
  .statusrow b{font-size:14px} .statusrow p{margin:2px 0 0;font-size:11.5px;color:var(--ink2)}
  .statusrow .val{margin-left:auto;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px}
  .statusrow .val.on{background:rgba(34,197,94,.15);color:#1f9a60}
  .statusrow .val.off{background:rgba(201,162,39,.16);color:#8a6f00}
  .togglerow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:var(--glass-b);border:1px solid var(--stroke);box-shadow:var(--shadow-sm);margin-bottom:9px;cursor:pointer}
  .togglerow b{font-size:14px} .togglerow p{margin:2px 0 0;font-size:11.5px;color:var(--ink2)}
  .sw{margin-left:auto;width:48px;height:28px;border-radius:99px;background:rgba(120,140,180,.28);position:relative;flex:0 0 auto;transition:background .2s}
  .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
  .sw.on{background:linear-gradient(150deg,#c7ea7e,#9ed23f)} .sw.on i{transform:translateX(20px)}

  /* avatar big header */
  .hero{display:flex;align-items:center;gap:12px;padding:6px 0 0}
  .hero .brand{display:flex;align-items:center;gap:10px;background:var(--glass-b);border:1px solid var(--stroke);padding:8px 16px 8px 8px;border-radius:99px;box-shadow:var(--shadow-sm)}
  .hero .brand .logo{width:42px;height:42px;border-radius:50%;background:linear-gradient(150deg,#5b8cf0,#3b6fe0);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px}
  .hero .brand b{display:block;font-size:16px;font-weight:800;line-height:1.1}
  .hero .brand span{font-size:12px;color:var(--ink2)}
  .bell{width:44px;height:44px;border-radius:50%;background:var(--glass-b);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow-sm);margin-left:auto;position:relative}
  .bell b{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:1.5px solid #fff}

  /* chat */
  .chat{flex:1 1 auto;overflow-y:auto;padding:14px 18px 14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
  .chat::-webkit-scrollbar{display:none}
  .msg{max-width:82%;padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.45;box-shadow:var(--shadow-sm);white-space:pre-wrap;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:linear-gradient(150deg,#c7ea7e,#9ed23f);color:#20301a;border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start;background:var(--glass-b);border:1px solid var(--stroke);border-bottom-left-radius:6px;backdrop-filter:blur(16px)}
  .msg.ai .who{font-size:12px;font-weight:800;color:var(--purple);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px}
  .typing i{width:8px;height:8px;border-radius:50%;background:var(--ink3);animation:bounce 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}

async function sb(path, opts){
  if(!SB.key) throw new Error("supabase not configured");
  const r = await fetch(SB.url + "/rest/v1/" + path, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: SB.key, Authorization: "Bearer " + SB.key, "Content-Type": "application/json",
      Prefer: "return=representation"
    }, (opts && opts.headers) || {})
  }));
  const txt = await r.text();
  if(!r.ok) throw new Error(txt || ("HTTP " + r.status));
  return txt ? JSON.parse(txt) : null;
}

/* ============ swipe gestures: edge-swipe to open, swipe to close ============ */
(function gestures(){
  const WIDTH = 286;
  const isRTL = ()=>document.documentElement.dir==="rtl";
  const isOpen = ()=>$("#drawer").classList.contains("on");
  let sx=0, sy=0, tracking=false, dragging=false, fromEdge=false, opened=false;
  function start(e){
    const p=e.touches[0]; sx=p.clientX; sy=p.clientY;
    opened=isOpen();
    fromEdge = isRTL() ? (window.innerWidth-p.clientX < 36) : (p.clientX < 36);
    tracking = opened || fromEdge;
    dragging=false;
  }
  function move(e){
    if(!tracking) return;
    const p=e.touches[0]; const dx=p.clientX-sx, dy=p.clientY-sy;
    if(!dragging){
      if(Math.abs(dx)<10 || Math.abs(dy)>Math.abs(dx)) return;
      if(!opened && !fromEdge) { tracking=false; return; }
      if(!opened && dx<0) { tracking=false; return; }
      if(opened && dx>0 && !fromEdge) { return; }
      dragging=true; $("#drawer").classList.add("dragging");
    }
    let x = opened ? dx : (isRTL() ? WIDTH + dx : -WIDTH + dx);
    x = isRTL() ? Math.min(WIDTH, Math.max(0, x)) : Math.max(-WIDTH, Math.min(0, x));
    $("#drawer").style.transform = "translateX("+x+"px)";
    const bd=$("#drawerBd"); bd.classList.add("on");
    bd.style.opacity = String(Math.min(1, (WIDTH-Math.abs(x))/WIDTH));
    if(e.cancelable) e.preventDefault();
  }
  function end(e){
    if(!tracking) return;
    const moved = dragging;
    tracking=false; dragging=false;
    const d=$("#drawer");
    d.classList.remove("dragging"); d.style.transform="";
    const bd=$("#drawerBd"); bd.style.opacity="";
    if(!moved){ if(fromEdge && !opened) openDrawer(); return; }
    const dx = e.changedTouches[0].clientX - sx;
    const shouldOpen = isRTL() ? (opened ? dx > -60 : dx < -60) : (opened ? dx > -60 : dx > 60);
    shouldOpen ? openDrawer() : closeDrawer();
  }
  document.addEventListener("touchstart", start, {passive:true});
  document.addEventListener("touchmove", move, {passive:false});
  document.addEventListener("touchend", end, {passive:true});
})();

function agentReply(id, q){
  const cn=cName(STATE.country), pn=pName(STATE.purpose), w=WS_STEPS[STATE.country];
  const low=q.toLowerCase();
  const req=WS_REQUIRED[STATE.purpose]||[];
  if(id==="arif"){
    if(/reject|refus|denied|রিজেক্ট|رفض/.test(low)) return "Rejection analysis flow:\n1) Upload the refusal letter (Rejection Analysis screen).\n2) I extract the refusal ground and separate letter facts from interpretation.\n3) I list what was missing and draft reapplication actions.\n4) You approve before anything is sent.\n\nIf you've uploaded it, tap “Assess Rejection”. Assessment: "+STATE.assessments.filter(x=>x.kind==="rejection").length+" on file.\n\n"+t("disclaimerShort");
    if(/review|assessment|মূল্যায়ন|تقييم/.test(low)) return "Case review — "+cn+" "+pn+":\n• Applicant: "+APPLICANT.name+"\n• Required docs: "+req.length+"\n• Uploaded: "+wsCtx().files.length+"\n• Country steps: "+w.steps.length+"\nRisk: needs human review on identity + financial evidence.\n\n"+t("disclaimerLong");
    if(/compare|previous|আগের|مقارنة/.test(low)) return "Comparing assessments: "+(STATE.assessments.length?("last one was “"+STATE.assessments[STATE.assessments.length-1].title+"” ("+STATE.assessments[STATE.assessments.length-1].risk+" risk).") :"none saved yet — run an assessment first.")+"\n\nI flag only what changed between versions; unverified items stay flagged.";
    if(/reapply|re-apply|আবার|إعادة/.test(low)) return "Reapplication plan — "+cn+" "+pn+":\n1. Address each refusal ground with new evidence.\n2. Add a cover letter explaining what changed.\n3. Re-verify every requirement on "+w.portal+".\n4. Lodge via the official channel (human submits).\n\n"+t("disclaimerShort");
    if(/explain|client|ব্যাখ্যা|شرح/.test(low)) return "Draft client explanation (for your review):\n“Dear "+APPLICANT.name.split(" ").slice(-1)[0]+", your "+cn+" "+pn+" application was assessed and found to need additional evidence. We are preparing: (1) updated financial documents, (2) a clarification letter, (3) re-verification against the official requirements. No submission will be made without your written approval.”\n\n— Draft only. You review and send.";
    if(/task|follow|কাজ|مهمة/.test(low)) return "I've drafted follow-up tasks. Open Tasks to review — each needs your approval before it goes out.";
    return "Arif here. Case "+STATE.caseId+" — "+cn+" "+pn+". I can: review the full case, assess a rejection, compare assessments, prepare a reapplication plan, draft a client explanation, and assign follow-up tasks.\n\n"+t("disclaimerShort");
  }
  if(id==="rakin"){
    if(/pack|huzur|প্যাক|حزمة/.test(low)) return "Case pack for "+cn+" "+pn+":\n1. Passport data page\n2. Application form draft\n3. "+req.length+" supporting documents\n4. Cover letter\n5. Fee/portal checklist\n\nAssembled as labelled drafts; nothing is submitted.\n\n"+t("disclaimerShort");
    return "Rakin here — end-to-end workflow for "+cn+" "+pn+":\n" + w.steps.map((s,i)=>(i+1)+") "+s[1]+" — "+s[0]).join("\n") + "\n\nUpload a passport and I'll map the whole path. Every step marked for human confirmation.";
  }
  if(id==="mira"){
    if(/http|www\.|\.gov|\.com|url|link/.test(low)) return "Research flow: paste an official URL (e.g. "+w.portal+"). Live retrieval isn't configured in this build, so I'll ask you to paste the page text or upload a saved copy, then I will cite the source and save it to this case's knowledge base.\n\n"+t("disclaimerShort");
    return "Mira here — visa research for "+cn+" "+pn+". Official portal: "+w.portal+". Ask me for requirements, fees or processing time, or paste a source URL.";
  }
  if(id==="hena") return "Hena here — document & compliance. Upload a document and I'll extract fields with a confidence flag per field and mark anything suspicious for human review. Files never leave this device in this build.\n\n"+t("disclaimerShort");
  if(id==="tisha") return "Tisha here — applicant case. Case "+STATE.caseId+": "+cn+" "+pn+". Required "+req.length+" docs, "+wsCtx().files.length+" uploaded. Next: complete the missing items and confirm the checklist.";
  if(id==="dia") return "Dia here — partnership research. I can draft employer/agency outreach for "+cn+" and research potential sponsors. Drafts only; a human sends them.";
  if(id==="nila") return "Nila here — client relations. I'll draft status updates and follow-ups for your approval. Want an update for "+APPLICANT.name.split(" ").slice(-1)[0]+" about the "+cn+" "+pn+" case?";
  if(id==="dola") return "Dola here — manager. Case "+STATE.caseId+" ("+cn+" "+pn+"): "+STATE.assessments.length+" assessment(s), "+STATE.tasks.length+" task(s), "+STATE.browserSessions.length+" browser session(s). What needs a decision?";
  return agentGreeting(id);
}

/* Rejection analysis: real PDF text extraction via pdf.js if available, else honest note */
async function analyzeRejection(idx){
  const r=STATE.rejections[idx]; if(!r) return;
  let text = r.text||"";
  const a = {
    kind:"rejection", title:"Visa Rejection Assessment — "+cName(STATE.country)+" "+pName(STATE.purpose),
    agent:"Arif (Senior Visa Specialist)", model:"vm-reason-2", version:1, time:nowStr(), user:APPLICANT.name,
    risk:"Needs Human Review", status:"AI Draft",
    reviewStatus:"Needs human review", _idx:idx
  };
  const low = text.toLowerCase();
  const has = re => re.test(low);
  if(!text.trim()){
    a.facts = "No machine-readable text extracted from the uploaded file (likely a scan or image).";
    a.interp = "Cannot determine the refusal ground without the actual letter text. A human must read the original document.";
    a.assume = "Refusal ground, date, reference and visa subclass are all unverified assumptions at this stage.";
    a.actions = "Re-upload a text-based PDF, or type the refusal ground, for a structured assessment.";
    a.risk="Needs Human Review";
  } else {
    const grounds=[]; if(has(/fund|bank|financial|balance|credit/)) grounds.push("Financial evidence / proof of funds");
      if(has(/purpose|genuine|intention|intent|tourist|visitor/)) grounds.push("Genuine temporary entrant / purpose of visit");
      if(has(/employ|job|work|contract|sponsor|nominat/)) grounds.push("Employment / sponsorship verifiability");
      if(has(/document|forg|counterfeit|inconsist|tamper/)) grounds.push("Document authenticity / inconsistency");
      if(has(/character|police|conduct|criminal/)) grounds.push("Character / police clearance");
      if(has(/health|medical|insurance/)) grounds.push("Health / insurance requirement");
      if(has(/english|ielts|language/)) grounds.push("English language requirement");
      if(has(/miss|incomplete|not provid|insufficient/)) grounds.push("Insufficient or missing evidence");
    if(!grounds.length) grounds.push("Refusal ground not clearly stated in extracted text (manual review needed)");
    a.facts = "Extracted letter text (excerpt): "+text.slice(0,700)+(text.length>700?"…":"");
    a.interp = "Likely refusal ground(s) indicated by the letter: "+grounds.join("; ")+". This maps to the refusal wording found in the document, not to a legal determination.";
    a.assume = "Assumed: that the extracted portion captures the operative refusal ground; that no separate decision notice exists; and that the applicant's identity details on file are current.";
    a.actions = "Address each ground with new or stronger evidence: "+grounds.map(g=>g.split(" /")[0]).join(", ")+". Verify exact requirements on the official portal.";
    a.risk = grounds.length>2?"High":"Medium";
  }
  STATE.assessments.push(a);
  if(STATE.country&&STATE.purpose) wsCtx().assessments.push(STATE.assessments.length-1);
  logAudit("Ran rejection analysis on "+r.name,"Arif");
  show("rejection");
}
/* extract text from a PDF data URL using pdf.js if loaded */
async function extractPdfText(file, cb){
  try{
    if(!window.pdfjsLib) return cb(null);
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
    let out="";
    for(let p=1;p<=Math.min(pdf.numPages,8);p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); out+=tc.items.map(i=>i.str).join(" ")+"\n"; }
    cb(out.trim());
  }catch(e){ cb(null); }
}

/* Website analysis (honest about missing backend) */
async function analyzeUrl(){
  const url=($("#urlIn")&&$("#urlIn").value.trim())||"";
  const depth=($("#depth")&&$("#depth").value)||"Standard report";
  const wl=($("#wlang")&&$("#wlang").value)||"en";
  if(!/^https?:\/\/.+\..+/.test(url)){ alert("Enter a full public URL starting with http(s)://"); return; }
  let host=""; try{ host=new URL(url).hostname; }catch(e){}
  const trusted=/\.gov|\.gov\.|immi\.|mfa\.|ica\.|evisa\.|visa\.|embassy|ministry/i.test(host);
  const rec={ title: depth+" — "+(host||url), url, time:nowStr(), type: depth, lang: wl, summary:"Fetching…", cites:[host||"unknown host"] };
  STATE.knowledge.push(rec); show("website");
  try{
    const r = await fetch(BACKEND.apiBase + "/api/analyze-url", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ url, preferred: STATE.aiProvider||null }) });
    const j = await r.json();
    if(!r.ok){ rec.summary = "Server fetch failed: " + (j.message||j.error||("HTTP "+r.status)) + ". " + (trusted?"Official-looking domain.":"Unverified domain."); rec.cites=[host, "fetch failed"]; }
    else{
      rec.title = (j.title||host)+" — "+depth;
      rec.summary = (j.summary? j.summary+"\n\n" : "") + "HTTP "+j.http_status+" · "+j.char_count+" chars extracted · "+j.trust_hint+"." + (j.summary?"":" (No AI provider configured — raw extraction only.)");
      rec.cites = [host, "robots "+(j.robots_allowed?"allowed":"disallowed"), j.provider?("AI "+j.provider):"no AI"];
      rec.excerpt = j.excerpt;
    }
  }catch(e){
    rec.summary = "Live retrieval backend not reachable (" + e.message + "). Deploy the /api/analyze-url function to enable real fetching. Host trust hint: " + (trusted?"official-looking government domain":"unverified domain") + ".";
    rec.cites = [host||"unknown host", "not retrieved"];
  }
  show("website");
}
function pdfFromUrl(idx){
  const k=STATE.knowledge[idx]; if(!k) return;
  buildAssessmentPdf({title:k.title, body:"Source: "+k.url+"\nAccessed: "+k.time+"\n\n"+k.summary, kind:"Website Analysis"});
}
function pdfFromAssessment(idx){
  const a=STATE.assessments[idx]; if(!a) return;
  buildAssessmentPdf({title:a.title, body:"Status: "+a.status+"\nRisk: "+a.risk+"\n\nLETTER FACTS\n"+a.facts+"\n\nAI INTERPRETATION\n"+a.interp+"\n\nUNVERIFIED ASSUMPTIONS\n"+a.assume+"\n\nACTIONS\n"+a.actions, kind:"Assessment"});
}
function empPdf(kind){
  const d=EMPLOYER_PDFS.find(p=>p.k===kind);
  const body = kind==="pack"
    ? "This case pack bundles: applicant profile, acknowledgement receipt, work agreement draft, and supporting documents. Each part is clearly labelled DRAFT."
    : "This is a clearly-labelled DRAFT generated from user-provided details. It contains no forged seals, stamps or signatures and is not an official document.";
  buildAssessmentPdf({title:(d?d.en:kind), body, kind:"Employer Draft"});
}
function buildAssessmentPdf(o){
  const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc2(o.title)}</title>
    <style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#132043;padding:32px;line-height:1.5}
    h1{color:#5a9440;font-size:22px} .k{font-size:12px;color:#5b6a8c;letter-spacing:1px;text-transform:uppercase}
    .body{white-space:pre-wrap;font-size:14px;border-top:2px solid #e6ecf7;padding-top:16px}
    .disc{margin-top:20px;font-size:11.5px;color:#7a5c00;background:#fff7e0;border-radius:10px;padding:12px}
    @media print{body{padding:12mm}}</style></head><body>
    <div class="k">VisaMOTion · ${esc2(o.kind)}</div>
    <h1>${esc2(o.title)}</h1>
    <div class="body">${esc2(o.body)}</div>
    <div class="disc"><b>Disclaimer:</b> ${esc2(t("disclaimerLong"))}</div></body></html>`;
  const w=window.open("","_blank");
  if(w && w.document){ w.document.write(html); w.document.close(); setTimeout(()=>{ try{w.print();}catch(e){} }, 450); return; }
  const blob=new Blob([html],{type:"text/html"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="VisaMotion_"+o.kind.replace(/\s+/g,"_")+".html"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ============ BIND ============ */
function bind(name){
  const root=$("#screens");
  root.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{ const g=el.dataset.go; if(["home","dashboard","visadesk","files","search","profile"].includes(g))STATE.tab=g; nav(g); });
  root.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>{ closeDrawer(); STATE.tab=el.dataset.nav; nav(el.dataset.nav); });
  root.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{ const tb=el.dataset.tab; STATE.tab=tb; nav(tb); });
  root.querySelectorAll("[data-tabnav]").forEach(el=>el.onclick=()=>{ const tb=el.dataset.tabnav; STATE.tab=tb; nav(tb); });
  root.querySelectorAll("[data-drawer]").forEach(el=>el.onclick=openDrawer);
  root.querySelectorAll("[data-send]").forEach(el=>el.onclick=()=>sendTo(el.dataset.send));
  root.querySelectorAll("[data-mic]").forEach(el=>el.onclick=()=>voice(el.dataset.mic,el));
  root.querySelectorAll("[data-file]").forEach(el=>el.onclick=pickFiles);
  root.querySelectorAll("[data-agent]").forEach(el=>el.onclick=()=>{ setActiveAgent(el.dataset.agent); });
  root.querySelectorAll("[data-sel]").forEach(el=>el.onchange=()=>{
    if(el.dataset.sel==="country") STATE.country=el.value; else STATE.purpose=el.value;
    STATE.pdfDataUrl=null; saveState(); const s=STATE.screen; show(s);
  });
  root.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>{ const inp=$("#cin")||$("#ain"); if(inp){inp.value=el.dataset.q; sendTo(STATE.screen==="agentchat"?"agent":"chat");} });
  root.querySelectorAll("[data-aq]").forEach(el=>el.onclick=()=>{ const inp=$("#ain"); if(inp){inp.value=el.dataset.aq; sendTo("agent");} });
  root.querySelectorAll("[data-country]").forEach(el=>el.onclick=()=>{ STATE.country=el.dataset.country; STATE.pdfDataUrl=null; saveState(); show(STATE.screen==="dashboard"?"dashboard":"visadesk"); });
  root.querySelectorAll("[data-purpose]").forEach(el=>el.onclick=()=>{ STATE.purpose=el.dataset.purpose; STATE.pdfDataUrl=null; saveState(); show("visadesk"); });
  root.querySelectorAll("[data-doc]").forEach(el=>el.onclick=()=>{ const k=el.dataset.doc; STATE.docsDone[k]=!STATE.docsDone[k]; saveState(); show("visadesk"); });
  root.querySelectorAll("[data-zoom]").forEach(el=>el.onclick=()=>{ STATE.pdfZoom=Math.min(1.4,Math.max(.6,STATE.pdfZoom+(el.dataset.zoom==="+"?.1:-.1))); show("pdfstudio"); });
  const ta = name==="chat"?$("#cin"):name==="agent"?$("#ain"):null;
  if(ta){ ta.oninput=()=>{ ta.style.height="auto"; ta.style.height=Math.min(100,ta.scrollHeight)+"px"; };
    ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendTo(name); } };
    setTimeout(()=>{ const chat=$("#chat"); if(chat) chat.scrollTop=chat.scrollHeight; },0);
  }
  root.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>{
    const a=el.dataset.act;
    if(a==="lang") langSheet();
    else if(a==="signout"){ if(confirm(t("logout")+"?")) alert("Signed out"); }
    else if(a==="agentapply") agentApply();
    else if(a==="pdfsave") savePdf();
    else if(a==="pdfedit"){ const n=prompt(t("fullName"),APPLICANT.name); if(n){} }
    else if(a==="install") doInstall();
    else if(a==="trainskill") trainSkill();
    else if(a==="clearpdf"){ STATE.pdfDataUrl=null; show("upload"); }
    else if(a==="saveupload"){ const a2=document.createElement("a"); a2.href=STATE.pdfDataUrl||"#"; a2.download="VisaMotion_upload.pdf"; a2.click(); }
    else if(a==="genreal"){ ensurePdf(url=>{ if(url){ STATE.screen="pdfstudio"; } }); }
    else if(a==="reveal-pass"){ STATE.passRevealed=!STATE.passRevealed; show(STATE.screen); }
    else if(a==="analyze-rejection"){ analyzeRejection(+el.dataset.idx); }
    else if(a==="ask-arif"){ STATE.country=STATE.country; setActiveAgent("arif"); }
    else if(a==="browser-start"){ browserStart(); }
    else if(a==="browser-approve"){ browserApprove(+el.dataset.idx); }
    else if(a.startsWith("arif-")){ arifCmd(a); }
    else if(a.startsWith("rakin-")){ rakinCmd(a); }
    else if(a==="cmd-pack"){ genCasePack(); }
    else if(a==="analyze-url"){ analyzeUrl(); }
    else if(a==="pdf-from-assessment"){ pdfFromAssessment(+el.dataset.idx); }
    else if(a==="pdf-url"){ pdfFromUrl(+el.dataset.idx); }
    else if(a==="emp-pdf"){ empPdf(el.dataset.kind); }
    else if(a==="employer-edit"){ alert("Employer details are entered and edited by you; nothing is auto-verified."); }
    else if(a==="employee-add"){ const n=prompt("Employee full name"); if(n){ (STATE.employer=STATE.employer||{employees:[]}).employees.push({n,c:STATE.country,p:STATE.purpose,s:"Documents pending"}); show("employer"); } }
    else if(a==="toggle-theme"){ STATE.theme = STATE.theme==="dark"?"light":"dark"; localStorage.setItem("vm_theme",STATE.theme); applyTheme(); show("settings"); }
    else if(a==="check-status"){ Promise.all([loadRemote(), checkAiStatus()]).then(()=>show("settings")); }
  });
}
