<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#5B54E8">
<title>VisaMotion File Box — Admin OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3B82F6; --blue-d:#2563EB; --blue-lt:#60A5FA;
  --purple:#7C6CF5; --purple-d:#6C5CE7; --purple-lt:#A78BFA;
  --yellow:#FFD84D; --yellow-d:#F5C518;
  --ink:#151A34; --ink-2:#6E7391; --ink-3:#9CA0BC;
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55);
  --stroke:rgba(255,255,255,.9); --stroke-2:rgba(255,255,255,.55);
  --shadow:0 14px 34px -14px rgba(38,52,132,.42), inset 0 1px 0 rgba(255,255,255,.9);
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{
  font-family:'Inter','Hind Siliguri',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(1000px 640px at 6% -8%, #cfd9ff 0%, transparent 56%),
    radial-gradient(880px 620px at 96% 4%, #e0d4ff 0%, transparent 54%),
    radial-gradient(900px 700px at 50% 112%, #b9c9ff 0%, transparent 58%),
    linear-gradient(170deg,#eef2ff 0%,#f0ecff 46%,#eef4ff 100%);
  background-attachment:fixed;
}
.wrap{position:relative;z-index:1;max-width:1980px;margin:0 auto;padding:14px 16px 80px}

/* ---------- top toolbar ---------- */
.topbar{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:10px 13px;border-radius:22px;margin-bottom:13px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke);box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;color:#fff;
  background:linear-gradient(145deg,var(--blue-lt),var(--purple));
  box-shadow:0 12px 24px -9px rgba(59,130,246,.85), inset 0 1px 0 rgba(255,255,255,.5);flex:none;
}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.35px;line-height:1.05;display:block}
.brand small{font-size:11px;color:var(--ink-2);font-weight:500}
.btn{
  border:1px solid var(--stroke-2);cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;
  padding:9px 13px;border-radius:15px;color:var(--ink);
  background:var(--glass-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:.18s transform,.18s box-shadow,.18s background;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.82);box-shadow:0 12px 22px -12px rgba(38,52,132,.5)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(140deg,var(--blue),var(--purple));color:#fff;border-color:transparent;
  box-shadow:0 12px 24px -10px rgba(91,84,232,.9), inset 0 1px 0 rgba(255,255,255,.4)}
.btn.on{background:linear-gradient(140deg,var(--blue),var(--purple));color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:rgba(38,52,132,.12)}
.dot{width:7px;height:7px;border-radius:99px;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2);flex:none}
.dot.off{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.2)}

/* ---------- mode chips ---------- */
.modebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.chip{
  padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);
  backdrop-filter:blur(16px);transition:.16s all;user-select:none;
}
.chip.on{background:linear-gradient(140deg,var(--blue),var(--purple));color:#fff;border-color:transparent;
  box-shadow:0 10px 20px -10px rgba(91,84,232,.85)}
.chip:hover{transform:translateY(-2px)}

/* ---------- showcase ---------- */
#showcase{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;align-items:start}
@media(max-width:1600px){#showcase{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1080px){#showcase{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){#showcase{grid-template-columns:1fr}}
#showcase.hide{display:none}

/* ---------- phone ---------- */
.phone{
  position:relative;border-radius:46px;padding:10px;
  background:linear-gradient(160deg,#ffffff,#eef1ff 60%,#e7ecff);
  border:1px solid var(--stroke);
  box-shadow:0 40px 80px -34px rgba(38,52,132,.5), 0 0 0 1px rgba(255,255,255,.55), inset 0 1px 0 #fff;
}
.phone-in{
  position:relative;border-radius:37px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(175deg,#ffffff 0%,#f5f6ff 52%,#eef1ff 100%);
  height:772px;
}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:34px;z-index:40;pointer-events:none;
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  font-size:12px;font-weight:700;color:#151A34;
}
.statusbar .r{display:flex;gap:5px;align-items:center;font-size:11px}
.notch{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:92px;height:26px;border-radius:999px;background:#0d1230;z-index:41;opacity:.9;
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:42px 15px 92px}
.screen::-webkit-scrollbar{display:none}

/* ---------- bottom nav ---------- */
.dock{
  position:absolute;left:0;right:0;bottom:0;z-index:35;
  display:flex;gap:2px;justify-content:space-around;align-items:center;
  padding:9px 10px 14px;border-top:1px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.86);backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 -10px 30px -18px rgba(38,52,132,.35);
}
.dock button{
  border:0;background:transparent;cursor:pointer;font:inherit;font-size:9.5px;font-weight:600;
  color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 8px;border-radius:14px;transition:.16s;flex:1;
}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button.act{color:var(--blue-d)}
.dock button.act svg{stroke:var(--blue-d)}
.dock button.fab{flex:none;width:56px;height:56px;margin-top:-26px;border-radius:50%;
  background:linear-gradient(145deg,#7C6CF5,#5B54E8);color:#fff;
  box-shadow:0 14px 26px -8px rgba(91,84,232,.95), 0 0 0 5px rgba(255,255,255,.85);
  display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.dock button.fab svg{width:26px;height:26px;stroke:#fff}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- glass primitives ---------- */
.g{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
   border:1px solid var(--stroke);box-shadow:var(--shadow)}
.card{border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
h1,h2,h3,h4,p{margin:0}
.t-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.t-sub{font-size:12px;color:var(--ink-2);font-weight:500}
.tiny{font-size:11px;color:var(--ink-2);font-weight:500}
.tiny2{font-size:10.5px;color:var(--ink-3);font-weight:500}
.pill{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;
  background:rgba(59,130,246,.12);color:var(--blue-d);display:inline-flex;align-items:center;gap:5px}
.pill.pro{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;
  box-shadow:0 8px 16px -8px rgba(91,84,232,.9)}
.pill.gold{background:linear-gradient(120deg,#FFE08A,#F5C518);color:#4A3200}
.pill.grn{background:rgba(34,197,94,.14);color:#16803C}
.pill.vi{background:rgba(124,108,245,.14);color:var(--purple-d)}
.chev{opacity:.35;flex:none;font-weight:700;font-size:15px}
.arrows{font-family:monospace;letter-spacing:-2px;font-size:15px;opacity:.55;font-weight:700}

/* progress */
.pbar{height:7px;border-radius:99px;background:rgba(255,255,255,.4);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--yellow);position:relative;overflow:hidden;transition:width .8s}
.pbar>i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sweep 2.2s linear infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* storage color cards */
.storage{border-radius:26px;padding:15px;color:#fff;position:relative;overflow:hidden;cursor:pointer;
  transition:.2s transform,.2s box-shadow;box-shadow:0 20px 40px -18px rgba(38,52,132,.6)}
.storage:hover{transform:translateY(-4px)}
.storage.blue{background:linear-gradient(150deg,#5AA0FF 0%,#2563EB 100%)}
.storage.purple{background:linear-gradient(150deg,#9B8CFF 0%,#6C5CE7 100%)}
.storage .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;
  background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);margin-bottom:12px}
.storage .pbar{background:rgba(255,255,255,.28)}
.ghostbtn{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);color:#fff;
  padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ghostbtn:hover{background:rgba(255,255,255,.36)}

/* category / mini tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border-radius:22px;padding:13px;text-align:left;cursor:pointer;transition:.18s;
  background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-4px);box-shadow:0 20px 34px -16px rgba(38,52,132,.5)}
.tile .em{font-size:30px;line-height:1;display:block;margin-bottom:8px}
.tile b{font-size:13px;font-weight:700;display:block;letter-spacing:-.2px}
.tile span{font-size:11px;color:var(--ink-2)}
.mini{border-radius:20px;padding:11px 8px;text-align:center;cursor:pointer;transition:.16s;
  background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.mini:hover{transform:translateY(-3px);background:rgba(255,255,255,.82)}
.mini .em{font-size:22px;display:block}
.mini b{font-size:10.5px;font-weight:700;display:block;margin-top:3px;line-height:1.25}
.mini span{font-size:9.5px;color:var(--ink-3)}

/* list items */
.li{display:flex;align-items:center;gap:11px;padding:11px;border-radius:20px;margin-bottom:9px;
  background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.iconbox{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;
  background:linear-gradient(145deg,#ffffff,#e7ecff);border:1px solid #fff;box-shadow:0 6px 14px -8px rgba(38,52,132,.4)}
.iconbox.blue{background:linear-gradient(145deg,#7FB2FF,#2563EB);color:#fff}
.iconbox.purple{background:linear-gradient(145deg,#B0A4FF,#6C5CE7);color:#fff}
.iconbox.gold{background:linear-gradient(145deg,#FFE08A,#F5C518)}

/* toggle */
.tg{width:44px;height:26px;border-radius:99px;background:rgba(38,52,132,.16);position:relative;cursor:pointer;
  flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:2.5px;left:2.5px;width:21px;height:21px;border-radius:99px;
  background:#fff;transition:.22s;box-shadow:0 3px 8px rgba(38,52,132,.3)}
.tg.on{background:linear-gradient(120deg,var(--blue),var(--purple))}
.tg.on::after{left:20.5px}

/* stats */
.stat{border-radius:22px;padding:13px 8px;text-align:center;
  background:linear-gradient(150deg,#ffffff,#f0f3ff);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.8px}
.stat span{font-size:10px;color:var(--ink-2);font-weight:600}

/* ai agent toast bar (ref bottom) */
.aibar{border-radius:24px;padding:12px;background:var(--glass);border:1px solid var(--stroke);
  box-shadow:var(--shadow);display:flex;align-items:center;gap:11px}
.aiic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none;
  background:linear-gradient(145deg,#8B7CFA,#5B54E8);color:#fff;box-shadow:0 10px 20px -8px rgba(91,84,232,.9)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">✈️</div>

    <div class="phone" id="p1"><div class="phone-in"><div class="notch"></div><div class="statusbar"><span>9:41</span><span class="r">📶 🛜 🔋</span></div><div class="screen" id="s1"></div><div class="dock" id="d1"></div></div></div>
    <div class="phone" id="p2"><div class="phone-in"><div class="notch"></div><div class="statusbar"><span>9:41</span><span class="r">📶 🛜 🔋</span></div><div class="screen" id="s2"></div><div class="dock" id="d2"></div></div></div>
    <div class="phone" id="p3"><div class="phone-in"><div class="notch"></div><div class="statusbar"><span>9:41</span><span class="r">📶 🛜 🔋</span></div><div class="screen" id="s3"></div><div class="dock" id="d3"></div></div></div>
    <div class="phone" id="p4"><div class="phone-in"><div class="notch"></div><div class="statusbar"><span>9:41</span><span class="r">📶 🛜 🔋</span></div><div class="screen" id="s4"></div><div class="dock" id="d4"></div></div></div>
  </div>

  <div id="flow" style="display:none">
    <div style="display:flex;justify-content:center">
      <div class="phone" style="width:430px;max-width:100%">
        <div class="phone-in" style="height:min(880px,calc(100vh - 190px));min-height:640px">
          <div class="notch"></div>
          <div class="statusbar"><span>9:41</span><span class="r">📶 🛜 🔋</span></div>

<script>
/* =====================================================================
   VisaMotion File Box — Admin OS (Step 3)
   5 Liquid Glass iOS screens + live Supabase / GitHub / Vercel deploy
   ===================================================================== */
const SB = {
  url:'https://bnexivtxepdknmkinmpj.supabase.co',
  key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZXhpdnR4ZXBka25ta2lubXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExODI0NjYsImV4cCI6MjEwNjc1ODQ2Nn0.fdYzXkVSfhIOeAiKd2jqRVIybkgIlFOIcO9XngjHVoE'
};
const COUNTRIES = [
  {id:'au',name:'Australia',flag:'🇦🇺',visa:'Subclass 600 Tourist Stream'},
  {id:'rs',name:'Serbia',   flag:'🇷🇸',visa:'D Visa (Long Stay)'},
  {id:'tr',name:'Turkey',   flag:'🇹🇷',visa:'e-Visa / Tourist'},
  {id:'sg',name:'Singapore',flag:'🇸🇬',visa:'Short-Term Visit Pass'},
  {id:'my',name:'Malaysia', flag:'🇲🇾',visa:'eVISA Tourist'},
  {id:'bh',name:'Bahrain',  flag:'🇧🇭',visa:'eVisa Visit'}
];
const FOLDERS = [
  {name:'Work Visa',    files:3, gb:2.8, tag:'PDF', date:'Updated: 10 Oct 2026, 14:32'},
  {name:'Visitor Visa', files:4, gb:1.9, tag:'DOC', date:'Updated: 09 Oct 2026, 11:20'},
  {name:'Student Visa', files:5, gb:3.4, tag:'IMG', date:'Updated: 08 Oct 2026, 16:45'},
  {name:'Business Visa',files:2, gb:1.2, tag:'PDF', date:'Updated: 07 Oct 2026, 10:18'}
];
const CATS = [
  {em:'📕',t:'PDF Documents',n:'8 files'},
  {em:'🛂',t:'Visa Files',  n:'6 files'},
  {em:'🖼️',t:'Images',      n:'4 files'},
  {em:'🗂️',t:'Applications',n:'3 files'}
];
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* flag emoji -> inline SVG roundel (renders everywhere, incl. headless Linux) */
const FLAG_CSS = {
  au:['#0B3D91','#fff','#E4002B'], rs:['#C6363C','#0C4076','#fff'], tr:['#E30A17','#fff','#E30A17'],
  sg:['#ED2939','#fff','#ED2939'], my:['#CC0001','#FFCC00','#010066'], bh:['#CE1126','#fff','#CE1126'],
  bd:['#006A4E','#F42A41','#006A4E']
};
function flagSVG(id,size=18){
  const c=FLAG_CSS[id]||['#2563EB','#fff','#7C6CF5'];
  if(id==='bd') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:-3px;flex:none"><circle cx="12" cy="12" r="11" fill="#006A4E"/><circle cx="10.6" cy="12" r="5" fill="#F42A41"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:-3px;flex:none">
    <defs><clipPath id="fc${id}"><circle cx="12" cy="12" r="11"/></clipPath></defs>

      <rect x="1" y="8.33" width="22" height="7.34" fill="${c[1]}"/><rect x="1" y="15.67" width="22" height="7.33" fill="${c[2]}"/></g>
    <circle cx="12" cy="12" r="11" fill="none" stroke="rgba(21,26,52,.18)" stroke-width="1"/></svg>`;
}
const GDRIVE = `<svg width="26" height="26" viewBox="0 0 48 44" style="display:block"><path d="M16 2h16l16 28H32z" fill="#FFCF63"/><path d="M16 2L0 30l8 14L32 2z" fill="#11A861"/><path d="M0 30h48l-8 14H8z" fill="#4185F4"/></svg>`;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const toastEls = [];

/* ---------- live Supabase ---------- */
async function sb(path, opts={}){
  const r = await fetch(SB.url+'/rest/v1/'+path,{
    ...opts,
    headers:{ apikey:SB.key, Authorization:'Bearer '+SB.key,
      'Content-Type':'application/json', Prefer:'return=representation', ...(opts.headers||{}) }
  });
  const txt = await r.text();
  if(!r.ok) throw new Error(txt||('HTTP '+r.status));
  return txt? JSON.parse(txt): null;
}
const DB = { dossiers:[], profiles:[], online:false, error:null };
async function dbLoad(){
  try{
    const [d,p] = await Promise.all([
      sb('visa_dossiers?select=*&order=country'),
      sb('applicant_profiles?select=*&order=created_at.desc&limit=20')
    ]);
    DB.dossiers=d||[]; DB.profiles=p||[]; DB.online=true; DB.error=null;
  }catch(e){
    DB.online=false; DB.error=e.message;
    DB.dossiers = COUNTRIES.map((c,i)=>({country:c.name,visa_type:c.visa,status:['submitted','draft','payment_pending','approved','draft','submitted'][i],
      progress:[72,45,60,100,30,88][i],applicant_name:'Imran Hossen'}));

/* =====================================================================
   REAL ZIP — pure-JS PKZIP (store, CRC32). Produces a valid .zip file.
   ===================================================================== */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
const enc=new TextEncoder();
function u16(n){return [n&255,(n>>8)&255];}
function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function pstr(s){return [...enc.encode(s)];}
function buildRealZipBlob(files){
  const parts=[], central=[]; let offset=0;
  const dosTime=((12<<11)|(0<<5)|(0>>1)), dosDate=(((2026-1980)<<9)|(10<<5)|14);
  files.forEach(f=>{
    const nameB=pstr(f.name), data=enc.encode(f.content), crc=crc32(data);
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),
                 ...u32(crc),...u32(data.length),...u32(data.length),...u16(nameB.length),...u16(0)];
    parts.push(new Uint8Array([...local,...nameB,...data]));
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),
                 ...u32(crc),...u32(data.length),...u32(data.length),...u16(nameB.length),...u16(0),...u16(0),
                 ...u16(0),...u16(0),...u32(0),...u32(offset),...nameB]);
    offset += local.length + nameB.length + data.length;
  });
  const cd=[].concat(...central);
  const end=[...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
             ...u32(cd.length),...u32(offset),...u16(0)];
  return new Blob([...parts,new Uint8Array(cd),new Uint8Array(end)],{type:'application/zip'});
}

function zoomPdf(d){ pdfZoom=Math.min(1.6,Math.max(.6,pdfZoom+d)); const p=document.getElementById('docPage'); if(p) p.style.transform='scale('+pdfZoom+')'; }
function savePdf(){
  const c=COUNTRIES.find(x=>x.id===studioCountry)||COUNTRIES[0];
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const lines=[
    `EMBASSY OF ${c.name.toUpperCase()} - VISA APPLICATION DOSSIER`,
    '================================================',
    `Country      : ${c.name}`,
    `Visa Type    : ${g('fVisa')}`,
    `Applicant    : ${g('fName')}`,
    `Passport     : ${g('fPass')}`,
    `Nationality  : Bangladesh`,
    `Purpose      : ${g('fPurpose')}`,
    `Notes        : ${g('fNote')}`,
    '------------------------------------------------',
    'Checklist: Passport (6+ mo) | Photo 35x45mm | Bank statement |',
    'Hotel/Flight booking | Travel insurance | Invitation (if any)',
    '------------------------------------------------',
    `Generated by VisaMOTion Admin OS on ${new Date().toLocaleString('en-GB')}`,
    'Verify all details on the official embassy website before filing.'
  ];
  const txt=lines.join('\n');
  const pad=(s,w)=>{ const words=s.split(' '); let out='',line='',res=[];
    words.forEach(wd=>{ if((line+wd).length>w){res.push(line.trim());line=wd+' ';} else line+=wd+' '; });
    if(line.trim())res.push(line.trim()); return res; };
  const content=`BT /F1 11 Tf 50 780 Td 16 TL\n${pad(txt,88).map(l=>'('+l.replace(/[()\\]/g,'')+') Tj T*').join('\n')}\nET`;
  // minimal single-page PDF
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>';
  objs[4]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
  objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  let pdf='%PDF-1.4\n', offs=[];
  for(let i=1;i<=5;i++){ offs[i]=pdf.length; pdf+=i+' 0 obj\n'+objs[i]+'\nendobj\n'; }
  const xref=pdf.length;
  pdf+='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) pdf+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  const blob=new Blob([pdf],{type:'application/pdf'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='VisaMOTion_'+c.name+'_Dossier.pdf'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('💾 PDF সেভ হয়েছে — '+c.name+'_Dossier.pdf');
  dbLog('system','PDF generated: '+c.name,S.engine);
}

async function deployGithub(){

  document.getElementById('ghInfo').innerHTML='Pushing…';
  // Expose publish endpoint result; GitHub push handled by the agent when run live.

  }catch(e){}
  say('Repo prepared: <b>visamotion-file-box</b> (single-file app + README + .gitignore)');

}
function openVercel(){ window.open('https://vercel.com/new','vercel'); }
async function publishLive(){
  const el=document.getElementById('liveUrl'); el.innerHTML='Publishing…';
  try{
    const r=await fetch(location.href); // no-op in local preview
  }catch(e){}

}
function zipPicked(inp){
  const f=inp.files[0]; if(!f) return;
  const log=document.getElementById('deployLog');
  log.innerHTML += '• Uploaded <b>'+esc(f.name)+'</b> ('+(f.size/1024).toFixed(1)+' KB) — packaged for deploy<br>';
  toast('⬆ .ZIP আপলোড হয়েছে');
}
