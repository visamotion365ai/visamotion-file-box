<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5B54E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>VisaMOTion — AI Visa Agency OS</title>
<style>
:root{
  --blue:#5B8DEF; --blue-d:#3D6FE0; --blue-lt:#7FA8FF;
  --purple:#8B6CE8; --purple-d:#7454DC; --purple-lt:#A98CF0;
  --yellow:#FFD84D;
  --ink:#151A34; --ink-2:#6E7391; --ink-3:#9CA0BC;
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55);
  --stroke:rgba(255,255,255,.9); --stroke-2:rgba(255,255,255,.55);
  --shadow:0 14px 34px -14px rgba(38,52,132,.42), inset 0 1px 0 rgba(255,255,255,.9);
  --r:24px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{
  font-family:'Inter','Hind Siliguri',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--ink); min-height:100vh; min-height:100dvh; overflow-x:hidden;
  background:
    radial-gradient(1000px 640px at 6% -8%, #cfd9ff 0%, transparent 56%),
    radial-gradient(880px 620px at 96% 4%, #e0d4ff 0%, transparent 54%),
    radial-gradient(900px 700px at 50% 112%, #b9c9ff 0%, transparent 58%),
    linear-gradient(170deg,#eef2ff 0%,#f0ecff 46%,#eef4ff 100%);
  background-attachment:fixed;
}
.wrap{position:relative;z-index:1;max-width:1980px;margin:0 auto;padding:14px 16px 80px}

/* ---------- top toolbar ---------- */
.topbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:10px 13px;border-radius:22px;margin-bottom:13px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;color:#fff;
  background:linear-gradient(145deg,var(--blue-lt),var(--purple));
  box-shadow:0 12px 24px -9px rgba(91,141,239,.85), inset 0 1px 0 rgba(255,255,255,.5);flex:none}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.35px;line-height:1.05;display:block}
.brand small{font-size:11px;color:var(--ink-2);font-weight:500}
.btn{border:1px solid var(--stroke-2);cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;
  padding:9px 13px;border-radius:15px;color:var(--ink);background:var(--glass-2);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:.18s transform,.18s box-shadow,.18s background;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.82);box-shadow:0 12px 22px -12px rgba(38,52,132,.5)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(140deg,var(--blue),var(--purple));color:#fff;border-color:transparent;
  box-shadow:0 12px 24px -10px rgba(91,84,232,.9), inset 0 1px 0 rgba(255,255,255,.4)}
.btn.on{background:linear-gradient(140deg,var(--blue),var(--purple));color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:rgba(38,52,132,.12)}
.dot{width:7px;height:7px;border-radius:99px;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2);flex:none;display:inline-block}
.dot.off{background:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.2)}

.modebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.chip{padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--stroke);background:var(--glass-2);color:var(--ink);
  backdrop-filter:blur(16px);transition:.16s all;user-select:none}
.chip.on{background:linear-gradient(140deg,var(--blue),var(--purple));color:#fff;border-color:transparent;
  box-shadow:0 10px 20px -10px rgba(91,84,232,.85)}
.chip:hover{transform:translateY(-2px)}

/* ---------- showcase ---------- */
#showcase{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;align-items:start}
@media(max-width:1600px){#showcase{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1080px){#showcase{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){#showcase{grid-template-columns:1fr}}
#showcase.hide{display:none}

/* ---------- phone ---------- */
.phone{position:relative;border-radius:46px;padding:10px;
  background:linear-gradient(160deg,#ffffff,#eef1ff 60%,#e7ecff);
  border:1px solid var(--stroke);
  box-shadow:0 40px 80px -34px rgba(38,52,132,.5), 0 0 0 1px rgba(255,255,255,.55), inset 0 1px 0 #fff}
.phone-in{position:relative;border-radius:37px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(175deg,#ffffff 0%,#f5f6ff 52%,#eef1ff 100%);height:790px}
.statusbar{position:absolute;top:0;left:0;right:0;height:34px;z-index:40;pointer-events:none;
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  font-size:12px;font-weight:700;color:#151A34}
.statusbar .r{display:flex;gap:5px;align-items:center;font-size:11px}
.notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:92px;height:26px;border-radius:999px;background:#0d1230;z-index:41;opacity:.9}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:42px 15px 96px}
.screen::-webkit-scrollbar{display:none}

/* ---------- flow (single app) ---------- */
#flow{display:none}
#flow.on{display:block}
.flowphone{width:430px;max-width:100%;margin:0 auto}
@media(max-width:520px){
  #showcase,#flow{display:none!important}
  .wrap{padding:0}
  .appfull{display:block!important}
}

/* ---------- bottom nav ---------- */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:35;
  display:flex;gap:2px;justify-content:space-around;align-items:center;
  padding:9px 10px 14px;border-top:1px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.86);backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 -10px 30px -18px rgba(38,52,132,.35)}
.dock button{border:0;background:transparent;cursor:pointer;font:inherit;font-size:9.5px;font-weight:600;
  color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 8px;border-radius:14px;transition:.16s;flex:1}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock button.act{color:var(--blue-d)}
.dock button.fab{flex:none;width:56px;height:56px;margin-top:-26px;border-radius:50%;
  background:linear-gradient(145deg,#8B6CE8,#5B54E8);color:#fff;
  box-shadow:0 14px 26px -8px rgba(91,84,232,.95), 0 0 0 5px rgba(255,255,255,.85);
  display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.dock button.fab svg{width:26px;height:26px;stroke:#fff}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.dock button .badge{position:absolute;font-style:normal}

/* ---------- glass primitives ---------- */
.g{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
   border:1px solid var(--stroke);box-shadow:var(--shadow)}
.card{border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
h1,h2,h3,h4,p{margin:0}
.t-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.tiny{font-size:11px;color:var(--ink-2);font-weight:500}
.tiny2{font-size:10.5px;color:var(--ink-3);font-weight:500}
.pill{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;
  background:rgba(91,141,239,.12);color:var(--blue-d);display:inline-flex;align-items:center;gap:5px}
.pill.pro{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;box-shadow:0 8px 16px -8px rgba(91,84,232,.9)}
.pill.gold{background:linear-gradient(120deg,#FFE08A,#F5C518);color:#4A3200}
.pill.grn{background:rgba(34,197,94,.14);color:#16803C}
.chev{opacity:.35;flex:none;font-weight:700;font-size:15px}
.arrows{font-family:monospace;letter-spacing:-2px;font-size:15px;opacity:.55;font-weight:700}
.pbar{height:7px;border-radius:99px;background:rgba(255,255,255,.4);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--yellow);position:relative;overflow:hidden;transition:width .8s}
.pbar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sweep 2.2s linear infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.storage{border-radius:26px;padding:15px;color:#fff;position:relative;overflow:hidden;cursor:pointer;
  transition:.2s transform,.2s box-shadow;box-shadow:0 20px 40px -18px rgba(38,52,132,.6)}
.storage:hover{transform:translateY(-4px)}
.storage.blue{background:linear-gradient(150deg,#7FA8FF 0%,#3D6FE0 100%)}
.storage.purple{background:linear-gradient(150deg,#A98CF0 0%,#7454DC 100%)}
.storage .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;
  background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.4);margin-bottom:12px}
.storage .pbar{background:rgba(255,255,255,.28)}
.ghostbtn{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);color:#fff;
  padding:7px 16px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ghostbtn:hover{background:rgba(255,255,255,.36)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border-radius:22px;padding:13px;text-align:left;cursor:pointer;transition:.18s;
  background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-4px);box-shadow:0 20px 34px -16px rgba(38,52,132,.5)}
.tile .em{font-size:30px;line-height:1;display:block;margin-bottom:8px}
.tile b{font-size:13px;font-weight:700;display:block;letter-spacing:-.2px}
.tile span{font-size:11px;color:var(--ink-2)}
.mini{border-radius:20px;padding:11px 8px;text-align:center;cursor:pointer;transition:.16s;
  background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.mini:hover{transform:translateY(-3px);background:rgba(255,255,255,.82)}
.mini .em{font-size:22px;display:block}
.mini b{font-size:10.5px;font-weight:700;display:block;margin-top:3px;line-height:1.25}
.mini span{font-size:9.5px;color:var(--ink-3)}

.li{display:flex;align-items:center;gap:11px;padding:11px;border-radius:20px;margin-bottom:9px;
  background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.iconbox{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;
  background:linear-gradient(145deg,#ffffff,#e7ecff);border:1px solid #fff;box-shadow:0 6px 14px -8px rgba(38,52,132,.4)}
.iconbox.blue{background:linear-gradient(145deg,#7FA8FF,#3D6FE0);color:#fff}
.iconbox.purple{background:linear-gradient(145deg,#B0A4FF,#7454DC);color:#fff}
.iconbox.gold{background:linear-gradient(145deg,#FFE08A,#F5C518)}
.tg{width:44px;height:26px;border-radius:99px;background:rgba(38,52,132,.16);position:relative;cursor:pointer;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:2.5px;left:2.5px;width:21px;height:21px;border-radius:99px;background:#fff;transition:.22s;box-shadow:0 3px 8px rgba(38,52,132,.3)}
.tg.on{background:linear-gradient(120deg,var(--blue),var(--purple))}
.tg.on::after{left:20.5px}
.stat{border-radius:22px;padding:13px 8px;text-align:center;background:linear-gradient(150deg,#ffffff,#f0f3ff);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.8px}
.stat span{font-size:10px;color:var(--ink-2);font-weight:600}
</style>
</head>

async function askAI(userText){
  const k = KEYS || {};
  // 0) Base44 AI agent (user key) — highest priority when present
  if(k.base44){
    try{
      const r = await fetch('https://app.base44.com/api/apps/'+(k.base44app||'')+'/agents/chat',{
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+k.base44},
        body:JSON.stringify({prompt:userText,system:sysPrompt()})});
      const j = await r.json();
      if(j && (j.text||j.answer||j.response)) return (j.text||j.answer||j.response);
    }catch(e){}
  }
  // 1) custom OpenAI-compatible endpoint (user key)
  if(k.custom_url){
    try{
      const r = await fetch(k.custom_url,{method:'POST',
        headers:{'Content-Type':'application/json',...(k.custom_key?{'Authorization':'Bearer '+k.custom_key}:{})},
        body:JSON.stringify({model:k.custom_name||'default',messages:[{role:'system',content:sysPrompt()},{role:'user',content:userText}]})});
      const j = await r.json();
      const t = j.choices?.[0]?.message?.content || j.text || j.answer;
      if(t) return t;
    }catch(e){}
  }
  // 2) real backend (Gemini)
  if(AI.online){
    try{
      const r = await fetch(API.ai,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({prompt:userText, system:sysPrompt(), model:'gemini-3.8-flash', key:KEYS.gemini||null})});
      const j = await r.json();
      if(j && j.text) return j.text;
    }catch(e){}
  }
  // 3) local rule engine (always available)
  return localReply(userText);
}

      body:JSON.stringify({country:c.name, portal:c.portal, visa:c.visa, purpose:S.purpose,

  }catch(e){}

  for(let i=0;i<S.applying.steps.length;i++){

/* ============ REAL ZIP (PKZIP store + CRC32) ============ */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
const enc=new TextEncoder();
function u16(n){return [n&255,(n>>8)&255];}
function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function pstr(s){return [...enc.encode(s)];}
function buildRealZipBlob(files){
  const parts=[], central=[]; let offset=0;
  const dosTime=((12<<11)|(0<<5)|(0>>1)), dosDate=(((2026-1980)<<9)|(10<<5)|14);
  files.forEach(f=>{
    const nameB=pstr(f.name), data=enc.encode(f.content), crc=crc32(data);
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),...u32(crc),...u32(data.length),...u32(data.length),...u16(nameB.length),...u16(0)];
    parts.push(new Uint8Array([...local,...nameB,...data]));
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(dosTime),...u16(dosDate),...u32(crc),...u32(data.length),...u32(data.length),...u16(nameB.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nameB]);
    offset += local.length + nameB.length + data.length;
  });
  const cd=[].concat(...central);
  const end=[...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cd.length),...u32(offset),...u16(0)];
  return new Blob([...parts,new Uint8Array(cd),new Uint8Array(end)],{type:'application/zip'});
}

  const txt=lines.join('\n');
  const pad=(s,w)=>{ const words=s.split(' '); let line='',res=[];
    words.forEach(wd=>{ if((line+wd).length>w){res.push(line.trim());line=wd+' ';} else line+=wd+' '; });
    if(line.trim())res.push(line.trim()); return res; };
  const content=`BT /F1 11 Tf 50 780 Td 16 TL\n${pad(txt,88).map(l=>'('+l.replace(/[()\\]/g,'')+') Tj T*').join('\n')}\nET`;
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>';
  objs[4]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
  objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  let pdf='%PDF-1.4\n', offs=[];
  for(let i=1;i<=5;i++){ offs[i]=pdf.length; pdf+=i+' 0 obj\n'+objs[i]+'\nendobj\n'; }
  const xref=pdf.length;
  pdf+='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++) pdf+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  const blob=new Blob([pdf],{type:'application/pdf'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='VisaMOTion_'+c.name+'_Dossier.pdf'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('💾 PDF সেভ হয়েছে — '+c.name+'_Dossier.pdf');
  dbLog('system','PDF generated: '+c.name,S.engine);
}

/* ============ PWA (installable) ============ */
function injectPWA(){
  const icon='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FA8FF"/><stop offset="1" stop-color="#5B54E8"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><text x="256" y="330" font-size="240" text-anchor="middle" fill="#fff">✈️</text></svg>`);
  ['icon','apple-touch-icon'].forEach(rel=>{ const l=document.createElement('link'); l.rel=rel; l.href=icon; document.head.appendChild(l); });
  const manifest={ name:'VisaMOTion — AI Visa Agency OS', short_name:'VisaMOTion', start_url:'./',
    display:'standalone', background_color:'#eef2ff', theme_color:'#5B54E8', orientation:'portrait',
    icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}] };
  const l=document.createElement('link'); l.rel='manifest';
  l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(l);
  if('serviceWorker' in navigator){
    const sw=`self.addEventListener('install',e=>self.skipWaiting());
      self.addEventListener('activate',e=>self.clients.claim());
      self.addEventListener('fetch',e=>{ e.respondWith(caches.open('vm-v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone())}catch(_){}return res}).catch(()=>r)))) });`;
    try{
      const url=URL.createObjectURL(new Blob([sw],{type:'text/javascript'}));
      navigator.serviceWorker.register(url).catch(()=>{});
    }catch(e){}
  }
}

/* ============ BOOT ============ */
(async function boot(){
  injectPWA();
  render();
  dbLoad().then(render);
  aiStatus().then(()=>render());
  setTimeout(()=>{ if(!AI.checked) render(); },3500);
})();
